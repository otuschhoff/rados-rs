[package]
name = "rados-r02-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(feature, values(\"fuzzing\"))"] }

[dependencies]
aes = "=0.9.3"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "=0.22.1"
cbc = { version = "=0.2.1", features = ["alloc"] }
crc32c = "=0.6.8"
hmac = "=0.13.0"
libfuzzer-sys = "=0.4.13"
sha2 = "=0.11.0"
tokio = { version = "=1.47.1", default-features = false, features = ["io-util"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[[bin]]
name = "primitive_decoder"
path = "fuzz_targets/primitive_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "versioned_envelope"
path = "fuzz_targets/versioned_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "entity_address"
path = "fuzz_targets/entity_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "entity_address_vector"
path = "fuzz_targets/entity_address_vector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "banner"
path = "fuzz_targets/banner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crc_frame"
path = "fuzz_targets/crc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secure_frame"
path = "fuzz_targets/secure_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "controls"
path = "fuzz_targets/controls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bounded_session_scripts"
path = "fuzz_targets/bounded_session_scripts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cephx_credentials"
path = "fuzz_targets/cephx_credentials.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cephx_server_challenge"
path = "fuzz_targets/cephx_server_challenge.rs"
