[package]
name = "rados-r02-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(feature, values(\"fuzzing\"))"] }

[dependencies]
aes = "=0.9.3"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "=0.22.1"
cbc = { version = "=0.2.1", features = ["alloc"] }
crc32c = "=0.6.8"
hmac = "=0.13.0"
libfuzzer-sys = "=0.4.13"
rados = { package = "rados-rs", path = "..", features = ["r05-integration", "r06-integration", "r07-integration", "r08-integration", "r09-integration", "r10-integration", "r11-integration", "r12-integration"] }
sha2 = "=0.11.0"
tokio = { version = "=1.47.1", default-features = false, features = ["io-util"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[[bin]]
name = "primitive_decoder"
path = "fuzz_targets/primitive_decoder.rs"
test = false
doc = false
bench = false

