name: R01 Differential Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-bridge:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Rust candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: rados-rs
          persist-credentials: false
      - name: Check out pinned Go oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: otuschhoff/rados-go
          ref: c8bb148a1379b51ef87256c27f366a05f8da4dc4
          token: ${{ secrets.RADOS_GO_TOKEN }}
          path: rados-go
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.8
          cache-dependency-path: rados-go/go.sum
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build Rust probe and verifier
        working-directory: rados-rs
        run: cargo build -p rados-r01-tools --bins --locked
      - name: Run bounded Rust/Go bridge
        working-directory: rados-rs
        run: |
          integration/r01/reproduce.sh \
            --go-root ../rados-go \
            --rust-probe target/debug/rados-r01-probe \
            --verifier target/debug/rados-r01-verify \
            --report target/r01/report.json