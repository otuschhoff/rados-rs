name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,llvm-tools-preview,rustfmt
      - name: Test debug profile
        run: cargo test --workspace --locked
      - name: Test release profile
        run: cargo test --workspace --release --locked
      - name: Check supported feature sets
        run: |
          cargo check -p rados-rs --locked
          cargo check -p rados-rs --no-default-features --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify package contents
        run: cargo package --locked
      - name: Verify checked-in R07 evidence
        run: cargo run --locked -p rados-r07-tools --bin rados-r07-verify -- . docs/r07/live-integration-report.json
      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories and dependency policy
        run: |
          cargo audit --deny warnings
          cargo deny check advisories bans licenses sources

  r06-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check out pinned Go oracle
        run: |
          git clone --no-checkout https://github.com/otuschhoff/rados-go.git /tmp/rados-go
          git -C /tmp/rados-go checkout --detach c8bb148a1379b51ef87256c27f366a05f8da4dc4
      - name: Run deterministic placement bridge
        run: integration/r06/reproduce.sh --go-root /tmp/rados-go --report target/r06/report.json

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-09-01 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run parser fuzz smoke tests
        run: |
          mkdir -p /tmp/rados-r02-corpus
          cp testdata/p01/*.bin /tmp/rados-r02-corpus/
          cargo +nightly-2026-09-01 fuzz run primitive_decoder /tmp/rados-r02-corpus -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run versioned_envelope /tmp/rados-r02-corpus -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run entity_address /tmp/rados-r02-corpus -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run entity_address_vector /tmp/rados-r02-corpus -- -max_total_time=10
      - name: Run messenger fuzz smoke tests
        run: |
          integration/r03/prepare-fuzz-corpus.sh /tmp/rados-r03-corpus
          cargo +nightly-2026-09-01 fuzz run banner /tmp/rados-r03-corpus/banner -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run crc_frame /tmp/rados-r03-corpus/crc_frame -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run secure_frame /tmp/rados-r03-corpus/secure_frame -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run controls /tmp/rados-r03-corpus/controls -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run messages /tmp/rados-r03-corpus/messages -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run bounded_session_scripts /tmp/rados-r03-corpus/bounded_session_scripts -- -max_total_time=10
      - name: Run placement fuzz smoke tests
        run: |
          integration/r06/prepare-fuzz-corpus.sh /tmp/rados-r06-corpus
          cargo +nightly-2026-09-01 fuzz run r06_crush_decode /tmp/rados-r06-corpus/r06_crush_decode -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run r06_crush_place /tmp/rados-r06-corpus/r06_crush_place -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run r06_object_mapping /tmp/rados-r06-corpus/r06_object_mapping -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run r06_osdmap_place_object /tmp/rados-r06-corpus/r06_osdmap_place_object -- -max_total_time=10
      - name: Run read-only object fuzz smoke tests
        run: |
          integration/r07/prepare-fuzz-corpus.sh /tmp/rados-r07-corpus
          cargo +nightly-2026-09-01 fuzz run r07_osd_reply /tmp/rados-r07-corpus/r07_osd_reply -- -max_total_time=10
          cargo +nightly-2026-09-01 fuzz run r07_osd_backoff /tmp/rados-r07-corpus/r07_osd_backoff -- -max_total_time=10
