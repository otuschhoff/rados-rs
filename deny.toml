[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = ["Apache-2.0", "LGPL-2.1-only", "MIT", "Unicode-3.0", "Unlicense"]
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = [
	{ crate = "syn@2.0.119", reason = "Tokio macros remain on syn 2 while the exact Serde derive pin uses syn 3; both are build-time proc macros." },
	{ crate = "windows-sys@0.52.0", reason = "Ring 0.17 and pinned tempfile 3.14 retain this Windows-only shim while Tokio/mio/socket2 use 0.61; Windows is outside the four-platform R13 qualification scope." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []