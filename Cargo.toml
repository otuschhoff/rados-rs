[workspace]
members = [".", "tools/r01", "tools/r02", "tools/r03", "tools/r04", "tools/r05", "tools/r06", "tools/r07", "tools/r08"]
exclude = ["fuzz"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LGPL-2.1-only"
rust-version = "1.98.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(rados_packaged_source)", "cfg(feature, values(\"fuzzing\"))"] }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[package]
name = "rados-rs"
version = "0.0.0"
description = "Native Rust client for Ceph RADOS"
edition.workspace = true
license.workspace = true
repository = "https://github.com/otuschhoff/rados-rs"
rust-version.workspace = true
publish = false
include = [
    "/src/**",
    "!/src/r07_integration.rs",
    "!/src/r08_integration.rs",
    "!/tools/r08/**",
    "!/integration/r08/**",
    "!/docs/r08/**",
    "/examples/**",
    "/docs/RUST_PORT_SPEC.md",
    "/docs/decisions/**",
    "/docs/r00/**",
    "/docs/r01/**",
    "/docs/r02/**",
    "/docs/r03/**",
    "/docs/r04/**",
    "/docs/r05/**",
    "/reference/**",
    "/integration/r01/**",
    "/integration/r02/**",
    "/integration/r03/**",
    "/integration/r04/**",
    "/testdata/README.md",
    "/testdata/manifest.schema.json",
    "/testdata/p01/entity-name-client-1.bin",
    "/testdata/p01/entity-name-client-1.bin.json",
    "/testdata/p01/entity-name-mon-new.bin",
    "/testdata/p01/entity-name-mon-new.bin.json",
    "/testdata/p01/entity-addr-ipv4-legacy.bin",
    "/testdata/p01/entity-addr-ipv4-legacy.bin.json",
    "/testdata/p01/entity-addr-ipv4-modern.bin",
    "/testdata/p01/entity-addr-ipv4-modern.bin.json",
    "/testdata/p01/entity-addr-ipv6-modern.bin",
    "/testdata/p01/entity-addr-ipv6-modern.bin.json",
    "/testdata/p01/entity-addrvec-modern.bin",
    "/testdata/p01/entity-addrvec-modern.bin.json",
    "/testdata/p02/**",
    "/testdata/p03/**",
    "/Cargo.toml",
    "/build.rs",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/RUST_THIRD_PARTY_NOTICES",
    "/THIRD_PARTY_NOTICES",
]

[lib]
name = "rados"

[features]
r04-integration = ["dep:serde", "dep:serde_json", "tokio/net", "tokio/rt-multi-thread"]
r05-integration = ["dep:serde", "dep:serde_json", "tokio/net", "tokio/rt-multi-thread"]
r06-integration = []
r07-integration = ["dep:serde", "dep:serde_json", "tokio/rt-multi-thread"]
r08-integration = ["dep:serde", "dep:serde_json", "tokio/rt-multi-thread"]

[[bin]]
name = "rados-r04-live"
path = "src/bin/rados-r04-live.rs"
required-features = ["r04-integration"]

[[bin]]
name = "rados-r05-live"
path = "src/bin/rados-r05-live.rs"
required-features = ["r05-integration"]

[dependencies]
aes = "=0.9.3"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "=0.22.1"
cbc = { version = "=0.2.1", features = ["alloc"] }
crc32c = "=0.6.8"
getrandom = "=0.4.3"
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["system-config", "tokio"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"], optional = true }
tokio = { version = "=1.47.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
loom = "=0.7.2"
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
tokio = { version = "=1.47.1", default-features = false, features = ["io-util", "macros", "rt", "sync", "test-util"] }

[lints]
workspace = true
