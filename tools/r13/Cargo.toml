[package]
name = "rados-r13-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
rados = { package = "rados-rs", path = "../.." }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "1.47.1", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync"] }

[[bin]]
name = "rados-r13-verify"
path = "src/bin/rados-r13-verify.rs"

[[bin]]
name = "rados-r13-qualify"
path = "src/bin/rados-r13-qualify.rs"

[[bin]]
name = "rados-r13-release"
path = "src/bin/rados-r13-release.rs"

[[bin]]
name = "rados-r13-fuzz"
path = "src/bin/rados-r13-fuzz.rs"

[[bin]]
name = "rados-r13-candidate"
path = "src/bin/rados-r13-candidate.rs"

[[bin]]
name = "rados-r13-probe"
path = "src/bin/rados-r13-probe.rs"

[[bin]]
name = "rados-r13-bench"
path = "src/bin/rados-r13-bench.rs"

[lints]
workspace = true