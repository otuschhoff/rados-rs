[package]
name = "rados-r04-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
test = false
doctest = false

[features]
default = ["fuzzing"]
fuzzing = []

[dependencies]
aes = "=0.9.3"
base64 = "=0.22.1"
cbc = { version = "=0.2.1", features = ["alloc"] }
command-group = "=5.0.1"
crc32c = "=0.6.8"
hmac = "=0.13.0"
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true