[package]
name = "rados-r12-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rados = { package = "rados-rs", path = "../.." }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "1.47.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "=3.14.0"

[lints]
workspace = true
