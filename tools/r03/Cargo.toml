[package]
name = "rados-r03-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
test = false
doctest = false

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
crc32c = "=0.6.8"
command-group = "=5.0.1"
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "1.47.1", default-features = false, features = ["io-util", "sync"] }

[lints]
workspace = true